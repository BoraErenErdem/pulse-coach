; PulseCoach - RunPod pod'u süreç yöneticisi (2026-09-30). setup.sh başlatır.
; Pod'da systemd ve Docker yok (pod'un kendisi bir container); tüm süreçler
; burada. Kalıcı olan yalnız /workspace - yollar ona göre.

[unix_http_server]
file=/tmp/pulsecoach-supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/logs/supervisord.log
pidfile=/tmp/pulsecoach-supervisord.pid
childlogdir=/workspace/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/pulsecoach-supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /workspace/pgdata -c listen_addresses=127.0.0.1 -c port=5432
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/workspace/logs/postgres.log
redirect_stderr=true

[program:ollama]
command=/workspace/opt/ollama/bin/ollama serve
priority=20
autorestart=true
; Ölçüm ve gerekçe: deploy/README.md "Ollama ayarı". NUM_PARALLEL=4, 4 eşzamanlı
; kullanıcıda beklemeyi ~%%40 azaltıyor (2026-09-29). Flash attention + q8_0 KV:
; daha az VRAM, e4b'de istem işleme ~%%45 hızlı, regresyon 41/41 (2026-09-30).
environment=OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/workspace/ollama-models",OLLAMA_NUM_PARALLEL="4",OLLAMA_MAX_LOADED_MODELS="3",OLLAMA_FLASH_ATTENTION="1",OLLAMA_KV_CACHE_TYPE="q8_0",HOME="/workspace"
stdout_logfile=/workspace/logs/ollama.log
redirect_stderr=true

; web/worker/tunnel release'ten SONRA setup.sh tarafından başlatılır.
[program:web]
; 127.0.0.1'e bağlı: dışarıya yalnız Cloudflare Tunnel açılır. Tünel de
; 127.0.0.1'e bağlanmalı (localhost IPv6 ::1'e gidebilir ve güvenilir vekil
; sayılmaz) - yoksa tüm kullanıcılar aynı IP görünür, IP bazlı limitler ortak olur.
command=/workspace/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips 127.0.0.1 --timeout-graceful-shutdown 30
directory=/workspace/pulse-coach/backend
environment=SCHEDULER_ENABLED="false",RUN_MIGRATIONS_ON_STARTUP="false"
autostart=false
autorestart=true
priority=30
stopasgroup=true
stdout_logfile=/workspace/logs/web.log
redirect_stderr=true

[program:webapp]
; Next.js web arayüzü: şifre sıfırlama sayfası (mobil de buraya yönlendiriyor),
; mağazaların istediği herkese açık gizlilik politikası (/kvkk) ve koşullar (/terms).
command=/workspace/pulse-coach/web/node_modules/.bin/next start -H 127.0.0.1 -p 3000
directory=/workspace/pulse-coach/web
environment=PATH="/workspace/opt/node/bin:/usr/bin:/bin",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
autostart=false
autorestart=true
priority=30
stopasgroup=true
stdout_logfile=/workspace/logs/webapp.log
redirect_stderr=true

[program:worker]
command=/workspace/venv/bin/python -m app.worker
directory=/workspace/pulse-coach/backend
environment=RCLONE_CONFIG="/workspace/secrets/rclone.conf"
autostart=false
autorestart=true
priority=30
stdout_logfile=/workspace/logs/worker.log
redirect_stderr=true

[program:tunnel]
command=/bin/bash /workspace/pulse-coach/deploy/runpod/run-tunnel.sh
autostart=false
autorestart=true
priority=40
stdout_logfile=/workspace/logs/tunnel.log
redirect_stderr=true
